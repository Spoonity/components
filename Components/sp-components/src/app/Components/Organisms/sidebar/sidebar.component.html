<div class="container" [ngStyle]="{ width: MenuWidht }">
  <div class="user">
    <spt-avatar [text]="userDisplay.name.charAt(0).toUpperCase()"></spt-avatar>
    <div class="text" *ngIf="!isCollapse">
      <span>{{ userDisplay.name }}</span>
      <span>{{ userDisplay.company }}</span>
    </div>
    <spt-icon
      class="icons"
      [toolTipTittle]="expandMore"
      [name]="expandMore"
      *ngIf="multipleAccounts && !isCollapse"
      (click)="expandAccounts()"
      [color]="iconColor"
    ></spt-icon>
    <div
      *ngIf="multipleAccountsSelection && !isCollapse"
      class="multiAccount spt-elevation--3 elevation-box"
    >
      <spt-text-field
        [placeholder]="'Filter by name'"
        [(ngModel)]="inputFilter"
        (ngModelChange)="filter()"
      ></spt-text-field>
      {{ inputFilter }}
      <div
        class="userMultiAccount"
        *ngFor="let account of AccountsDisplay"
        (click)="switchAccount(account)"
      >
        <spt-avatar [text]="account.title.charAt(0).toUpperCase()"></spt-avatar>
        <div class="text-multiple-accounts" *ngIf="!isCollapse">
          <span>{{ account.name }}</span>
          <span>{{ account.company }}</span>
        </div>
      </div>
    </div>
  </div>
  <spt-divider></spt-divider>
  <div class="menu" [ngStyle]="{ height: MenuHeight }">
    <div
      *ngFor="let option of optionsData"
      class="option"
      [ngStyle]="{ width: OptionWidht }"
      [ngClass]="{ active: option.isActive }"
      (click)="onActive(option)"
    >
      <spt-icon
        class="icons"
        [toolTipTittle]="option.title"
        [name]="option.icon.name"
        [color]="iconColor"
      ></spt-icon>
      <span *ngIf="!isCollapse">{{ option.title }}</span>
      <div
        class="orange-line"
        [ngStyle]="{ right: lineRight }"
        *ngIf="option.isActive"
      ></div>
    </div>
  </div>
  <spt-divider></spt-divider>
  <div class="collapse" (click)="onCollapse()">
    <spt-icon
      class="icons"
      [toolTipTittle]="keyboarTab"
      [name]="keyboarTab"
      [color]="iconColor"
    ></spt-icon>
  </div>
  <spt-divider></spt-divider>
  <div class="user-email">
    <div class="user">
      <div class="text" *ngIf="!isCollapse">
        <span>{{ userDisplay.name }}</span>
        <span class="small">{{ userDisplay.email }}</span>
      </div>
      <spt-icon
        class="icons"
        [toolTipTittle]="expandLess"
        [name]="expandLess"
        *ngIf="!onToggleLogout"
        (click)="toggleLogout()"
        [color]="iconColor"
      ></spt-icon>
      <spt-icon
        class="icons"
        [toolTipTittle]="accountBox"
        [name]="accountBox"
        *ngIf="onToggleLogout"
        (click)="toggleLogout()"
        [color]="iconColor"
      ></spt-icon>
    </div>
    <div class="flex-btn" *ngIf="onToggleLogout && !isCollapse">
      <spt-button
        class="btn"
        [text]="'LOGOUT'"
        [type]="buttonType"
        [size]="buttonSize"
        [leftIcon]="logoutIcon"
        (click)="sidebarData.logout()"
      ></spt-button>
    </div>
  </div>
</div>
