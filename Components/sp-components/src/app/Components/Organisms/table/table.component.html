<nz-table class="table"
          [nzShowPagination]="false"
          [nzFrontPagination]="false"
          [nzData]="dataSet">
  <thead>
    <tr>
      <th *ngIf="checkboxOn">
        <spt-checkbox></spt-checkbox>
      </th>
      <th *ngFor="let title of rows">
        <b>{{ title }}</b>
      </th>
    </tr>
  </thead>
  <tbody>
    <ng-content select="tr"></ng-content>
  </tbody>
</nz-table>
