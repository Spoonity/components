<button nz-button nzNoAnimation [nzType]="type" [nzSize]="size" [disabled]="disabled" [ngClass]="{'ant-btn-secondary': type === B.secondary, 'ant-btn-tertiary': type === B.tertiary, 'with-text': text != null}">
  <spt-icon *ngIf="leftIcon" [name]="leftIcon"></spt-icon>
  <span *ngIf="text" [ngClass]="{leftIcon: leftIcon,rightIcon: rightIcon}">{{ text }}</span>
  <spt-icon *ngIf="rightIcon" [name]="rightIcon"></spt-icon>
</button>
