<nz-tag
  [nzMode]="mode"
  [nzChecked]="checked"
  (nzOnClose)="onClose()"
  (nzCheckedChange)="checkChange($event)"
  [attr.disabled]="disabled"
>
  <svg-icon
    *ngIf="icon || checked"
    nz-icon
    [name]="checked ? 'check' : icon"
    [svgStyle]="styles"
  ></svg-icon>
  <span class="sp-spacing-x--1">{{ text }}</span>
</nz-tag>
