steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/components:$BRANCH_NAME', '.' ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/components:$BRANCH_NAME' ]

  - name: 'gcr.io/cloud-builders/kubectl'
    args: [ 'set', 'image', 'deployment/components-deployment', 'dashboard=gcr.io/$PROJECT_ID/components:$BRANCH_NAME' ]
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=spoonity'

  - name: 'gcr.io/cloud-builders/kubectl'
    args: [ 'patch', 'deployment/components-deployment', '-p', '{"spec":{"template":{"metadata":{"labels":{"build":"$COMMIT_SHA"}}}}}}' ]
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=spoonity'

tags: [ 'app', 'components' ]
images: [ 'gcr.io/$PROJECT_ID/components' ]
