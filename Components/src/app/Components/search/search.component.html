<div #searchReference class="sp-input-container search-container" [ngClass]="{'disabled-container': isDisabled}">
    <input #input [ngClass]="{'dirty': isDirty, 'error': !!error, 'has-left-icon': true, 'has-right-icon': !!endIcon, 'disabled-state': isDisabled}"
           [(ngModel)]="value"
           (ngModelChange)="changeAction($event)"
           (keydown)="onKeyDown($event)"
           class="{{size}} has-left-icon"
           placeholder="{{placeholder}}" autocomplete="off">

    <!-- search icon -->
    <span class="text-field-icon left-icon">
        <svg-icon name="search" [svgStyle]="{ 'width.px':24 }"></svg-icon>
    </span>

    <sp-dropdown-template [reference]="searchReference" #searchComp>
        <div class="search-option-container sp-elevation--5">
            <ng-content select="sp-search-option"></ng-content>
        </div>
    </sp-dropdown-template>

</div>
