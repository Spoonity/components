<ng-template #tplTitle>
    <span class="title">
    {{ title }}
  </span>
</ng-template>
<ng-template #tplContent>
    <span class="content">
    {{ content }}
  </span>
</ng-template>
<ng-template #tplFooter let-ref="modalRef">
    <button nz-button nzType="secondary" (click)="modalRef.destroy(); action1()">
    Action 1
  </button>
    <button nz-button nzType="primary" (click)="modalRef.destroy(); action2()">
    Action 2
  </button>
</ng-template>
