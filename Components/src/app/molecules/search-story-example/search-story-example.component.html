<div class="spt-spacing-x--1">
    <spt-search [size]="size"
               placeholder="Search fruits or vegetables"
               [(ngModel)]="SearchModel"
               [selectedItems]="SelectedItems"
               (filter)="filter(filterSize)"
               (itemSelected)="ItemSelected($event)"
               (itemRemoved)="ItemRemoved($event)">
        <spt-search-option [value]="f" *ngFor="let f of FilteredList">
            <span>{{f.name}} - </span>
            <span class="light"><em>{{f.type}} </em></span>
            <span class="light">(color: {{f.color}})</span>
        </spt-search-option>
    </spt-search>
</div>
<div *ngIf="filterSize === 'noDropdown'"  class="spt-spacing-y--1">
    <h4>Search Results:</h4>
    <p *ngIf="getNoDropdownList().length === 0" class="light"><em>No Items to show</em></p>

    <div *ngFor="let f of getNoDropdownList()" class="spt-spacing--1" style="border-bottom: 1px solid #eee">
        <span>{{f.name}} - </span>
        <span class="light"><em>{{f.type}} </em></span>
        <span class="light">(color: {{f.color}})</span>
    </div>

    <ng-template #noDropdownItem>
        <li class="spt-spacing-y--1" style="border-bottom: 1px solid #eee">

        </li>
    </ng-template>
</div>
