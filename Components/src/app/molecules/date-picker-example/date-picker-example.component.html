<div class="text-field-section" style="width: 300px">
    <h2>DATE PICKER</h2>

    <div class="spt-spacing-y--1 text-field-row">
        <div class="spt-spacing-x--1">
            <spt-date-picker [(ngModel)]="date" label="date" size="large" dateFormat="dd/MM"></spt-date-picker>
        </div>
    </div>

    <p>date object: {{date}}</p>

    <div class="spt-spacing-y--1 text-field-row">
        <div class="spt-spacing-x--1">
            <spt-date-picker [(ngModel)]="date2" label="date2" size="medium"></spt-date-picker>
        </div>
    </div>

    <p>date object: {{date2}}</p>

    <div class="spt-spacing-y--1 text-field-row">
        <div class="spt-spacing-x--1">
            <spt-date-picker [(ngModel)]="date3" label="date3 (with min and max)" size="large" [min]="minDate" [max]="maxDate"></spt-date-picker>
        </div>
    </div>

    <p>date object: {{date3}}</p>

    <!--- RANGE CALENDAR --->
    <div class="spt-spacing-y--1">
        <div class="text-field-row">
            <!-- start date -->
            <div class="spt-spacing-x--1">
                <spt-date-picker [(ngModel)]="rangeStart" label="Start Date" size="large" [max]="rangeEnd"></spt-date-picker>
            </div>

            <!-- end date -->
            <div class="spt-spacing-x--1">
                <spt-date-picker [(ngModel)]="rangeEnd" label="EndDate" size="large" [min]="rangeStart"></spt-date-picker>
            </div>
        </div>
        <div class="spt-spacing-top--1">
            <spt-range-calendar [startDate]="rangeStart" [endDate]="rangeEnd" (onChange)="rangeChanged($event)"></spt-range-calendar>
        </div>
    </div>
</div>
